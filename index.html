<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCJH</title>

    <!-- Cinzel (Trajan-style) font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
        }

        /* OUTLINED CINZEL */
        .outlined {
            -webkit-text-stroke: 2px #ffffff;
            text-shadow: 0 2px 3px rgba(0,0,0,0.6);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: clamp(56px, 10vw, 96px);
            letter-spacing: 6px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .red { color: #E8000D; }
        .blue { color: #0051BA; }

        /* IMAGE — 50% smaller */
        img.main {
            width: 50%;
            max-width: 450px;
            height: auto;
            border: 4px solid #000;
            background: #fff;
        }

        /* SCOREBOARD */
        .scoreboard {
            max-width: 520px;
            margin: 24px auto;
            background: #0b1c2d;
            color: #ffffff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 12px;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .team-info img {
            width: 36px;
            height: 36px;
        }

        .score {
            font-size: 30px;
        }

        footer {
            margin-top: 32px;
            font-size: 13px;
            color: #555;
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 480px) {
            img.main {
                width: 90%;
            }

            .team-info {
                font-size: 16px;
            }

            .team-info img {
                width: 30px;
                height: 30px;
            }

            .score {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <h1>
        <span class="outlined red">R</span>
        <span class="outlined blue">C</span>
        <span class="outlined red">J</span>
        <span class="outlined blue">H</span>
    </h1>

    <img src="67.jpg" alt="RCJH Image" class="main">

    <div class="scoreboard outlined" id="scoreboard">
        Loading scoreboard…
    </div>

    <footer>
        <div id="counter">0</div>
    </footer>

<script>
async function fetchScore() {
    try {
        const res = await fetch(
            'https://api.allorigins.win/raw?url=' +
            encodeURIComponent(
                'https://site.web.api.espn.com/apis/v2/sports/basketball/mens-college-basketball/scoreboard'
            )
        );

        const data = await res.json();

        const event = data.events.find(e =>
            e.competitions?.[0]?.competitors?.some(c =>
                c.team?.displayName === 'Kansas Jayhawks'
            )
        );

        if (!event) {
            document.getElementById('scoreboard').textContent =
                'No recent Kansas game found.';
            return;
        }

        const comp = event.competitions[0];
        const status = comp.status.type;

        const away = comp.competitors.find(c => c.homeAway === 'away');
        const home = comp.competitors.find(c => c.homeAway === 'home');

        const gameDate = new Date(event.date).toLocaleDateString();
        const isFinal = status.completed;
        const wentOT = status.description.includes('OT');

        document.getElementById('scoreboard').innerHTML = `
            <div class="scoreboard-header outlined">
                <div>${gameDate}</div>
                <div>${isFinal ? 'Final' : status.description}${wentOT ? ' • OT' : ''}</div>
            </div>

            <div class="team-row">
                <div class="team-info outlined">
                    <img src="${away.team.logo}">
                    ${away.team.displayName}
                </div>
                <div class="score outlined">${away.score}</div>
            </div>

            <div class="team-row">
                <div class="team-info outlined">
                    <img src="${home.team.logo}">
                    ${home.team.displayName}
                </div>
                <div class="score outlined">${home.score}</div>
            </div>
        `;
    } catch (e) {
        document.getElementById('scoreboard').textContent =
            'Unable to load scoreboard.';
        console.error(e);
    }
}

fetchScore();
setInterval(fetchScore, 120000);
</script>

</body>
</html>
