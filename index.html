<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RCJH</title>

    <!-- Big Top circus-style font -->
    <link href="https://fonts.googleapis.com/css2?family=Big+Top&display=swap" rel="stylesheet">

    <style>
        body {
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: 'Big Top', cursive;
            font-size: 96px;
            letter-spacing: 6px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .red { color: #E8000D; }
        .blue { color: #0051BA; }

        img.main {
            max-width: 90%;
            height: auto;
            border: 5px solid #000;
            background: #fff;
        }

        /* SCOREBOARD */
        .scoreboard {
            max-width: 600px;
            margin: 30px auto;
            background: #0b1c2d;
            color: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.85;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }

        .team-info img {
            width: 40px;
            height: 40px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>
        <span class="red">R</span>
        <span class="blue">C</span>
        <span class="red">J</span>
        <span class="blue">H</span>
    </h1>

    <img src="67.jpg" alt="RCJH Image" class="main">

    <div class="scoreboard" id="scoreboard">
        Loading scoreboard…
    </div>

    <footer>
        <div id="counter">Visits: 0</div>
    </footer>

    <script>
        // Visit counter
        let count = localStorage.getItem('visitCount') || 0;
        count++;
        localStorage.setItem('visitCount', count);
        document.getElementById('counter').textContent = 'Visits: ' + count;

        async function fetchScore() {
            try {
                const apiKey = '123';
                const res = await fetch(
                    `https://www.thesportsdb.com/api/v1/json/${apiKey}/eventslast.php?id=138589`
                );
                const data = await res.json();
                const g = data.results[0];

                const gameDate = new Date(g.dateEvent).toLocaleDateString();
                const wentOT = g.strDescriptionEN && g.strDescriptionEN.includes('OT');

                document.getElementById('scoreboard').innerHTML = `
                    <div class="scoreboard-header">
                        <div>${gameDate}</div>
                        <div>Final${wentOT ? ' • OT' : ''}</div>
                    </div>

                    <div class="team-row">
                        <div class="team-info">
                            <img src="${g.strHomeTeamBadge}">
                            ${g.strHomeTeam}
                        </div>
                        <div class="score">${g.intHomeScore}</div>
                    </div>

                    <div class="team-row">
                        <div class="team-info">
                            <img src="${g.strAwayTeamBadge}">
                            ${g.strAwayTeam}
                        </div>
                        <div class="score">${g.intAwayScore}</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('scoreboard').textContent =
                    'Unable to load score.';
                console.error(e);
            }
        }

        fetchScore();
        setInterval(fetchScore, 120000);
    </script>

</body>
</html>
